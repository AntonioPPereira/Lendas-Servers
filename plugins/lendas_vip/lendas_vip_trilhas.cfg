// ==========================================================================
// Estilos de trilha do jogador.
// Vai para addons/sourcemod/configs/lendas_vip_trilhas.cfg
//
// Cada bloco e um estilo que aparece no menu. O menu e montado DESTE arquivo,
// entao estilo novo nao precisa recompilar o plugin: acrescente o bloco e
// troque de mapa.
//
// CAMPOS
//   nome      o que aparece no menu. Sem acento -- o menu do CS:S nao lida bem.
//   sprite    o material desenhado, SEM o "materials/" da frente.
//   largura   espessura no comeco da trilha, em unidades do jogo.
//   fim       espessura no fim. Menor que a largura = rastro que afina.
//   duracao   segundos que o rastro fica no ar antes de sumir.
//   modo      modo de desenho: 5 = aditivo (brilha, e o que serve para quase
//             tudo), 1 = colorido normal (opaco, para fumaca).
//
// O "materials/" NAO VAI AQUI, E ISSO JA QUEBROU TUDO UMA VEZ
//   O motor prepende "materials/" sozinho ao carregar um sprite. Escrever
//   "materials/sprites/laserbeam.vmt" faz ele procurar
//   "materials/materials/sprites/laserbeam.vmt", nao achar, e desistir SEM
//   ERRO NENHUM -- o log continua dizendo que o estilo e utilizavel e nada
//   aparece na tela.
//
//   Foi o que aconteceu com a versao anterior deste arquivo: os seis estilos
//   estavam certos, os arquivos existiam, e nenhum desenhava. A confirmacao
//   veio dos mapas instalados: das 1386 entidades de sprite neles, 1384
//   escrevem o caminho sem o prefixo.
//
//   O plugin hoje aceita as duas formas e conserta sozinho, mas o certo e
//   este: sem prefixo.
//
// SPRITE QUE NAO EXISTE NAO APARECE NO MENU
//   O plugin confere cada um contra o sistema de arquivos do jogo (inclusive
//   dentro dos VPK) e, se nao achar, o estilo some do menu e o nome vai para o
//   log. Todos os oito abaixo foram conferidos no cstrike_pak e nos VPK do
//   hl2 que o CS:S instala junto: os oito tem .vmt E .vtf. O .vmt sozinho nao
//   basta -- ele so aponta para a textura.
//
// ALTURA
//   Nao e por estilo: e o cvar lendas_vip_trilha_altura, em unidades do jogo,
//   medido a partir do CHAO (a origem do jogador no Source fica nos pes).
//   0 = colado no chao. 35 = cintura. 64 = cabeca.
// ==========================================================================

