// ==========================================================================
// Estilos de trilha do jogador.
// Vai para addons/sourcemod/configs/lendas_vip_trilhas.cfg
//
// Cada bloco e um estilo que aparece no menu. O menu e montado DESTE arquivo,
// entao estilo novo nao precisa recompilar o plugin: acrescente o bloco e
// troque de mapa.
//
// CAMPOS
//   nome      o que aparece no menu. Sem acento -- o menu do CS:S nao lida bem.
//   sprite    o material desenhado. Caminho a partir de cstrike/.
//   largura   espessura no comeco da trilha, em unidades do jogo.
//   fim       espessura no fim. Menor que a largura = rastro que afina.
//   duracao   segundos que o rastro fica no ar antes de sumir.
//   modo      modo de desenho: 5 = aditivo (brilha, bom para linha luminosa),
//             1 = colorido normal (opaco, bom para fumaca).
//
// SPRITE QUE NAO EXISTE NAO APARECE NO MENU
//   Nem todo sprite existe em toda instalacao do CS:S. O plugin confere cada
//   um contra o sistema de arquivos do jogo (inclusive dentro dos VPK) e, se
//   nao achar, o estilo some do menu e o nome vai para o log. E melhor o
//   estilo nao existir do que existir e desenhar um quadrado rosa.
//
//   Quando trocar de mapa, olhe o log: ele lista quantos estilos entraram e
//   quais ficaram de fora. Ai da para saber quais sprites esta instalacao tem
//   sem ficar adivinhando.
//
// ALTURA
//   Nao e por estilo: e o cvar lendas_vip_trilha_altura, em unidades do jogo,
//   medido a partir do CHAO (a origem do jogador no Source fica nos pes).
//   0 = colado no chao. 35 = cintura. 64 = cabeca, que era onde estava preso
//   antes e foi o motivo desta reescrita.
// ==========================================================================

"Trilhas"
