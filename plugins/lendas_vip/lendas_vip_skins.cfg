// ==========================================================================
// Skins do menu VIP.
// Vai para addons/sourcemod/configs/lendas_vip_skins.cfg
//
// Cada bloco e uma skin. O menu e montado a partir DESTE arquivo, entao
// acrescentar skin nova nao precisa recompilar o plugin nem reiniciar o
// servidor: edite aqui e troque de mapa.
//
// CAMPOS
//   nome    o que aparece no menu. Sem acento -- o chat do CS:S mostra lixo.
//   modelo  caminho do .mdl a partir de cstrike/
//   times   "tr", "ct" ou "ambos". Restringe em qual time a skin pode ser
//           escolhida; a maioria serve para os dois.
//
// A ORDEM E A IDENTIDADE
//   A chave do bloco ("1", "2", ...) e o que fica GRAVADO na preferencia do
//   jogador. Mudar o numero de uma skin existente faz quem a escolheu passar
//   a usar outra. Para tirar uma skin de circulacao, apague o bloco -- quem
//   tinha aquele numero cai no modelo padrao sozinho, sem erro.
//
// OS ARQUIVOS PARA BAIXAR NAO ESTAO AQUI
//   Quem manda o cliente baixar e o lendas_downloads, pelo
//   configs/lendas_downloads.cfg. E de proposito: um assunto, um dono. Ao
//   acrescentar skin aqui, acrescente os arquivos dela la -- o .mdl, os
//   irmaos (.vvd, .vtx, .phy) e so os materiais que o modelo realmente usa.
// ==========================================================================

