// ==========================================================================
// Modo minigame DESLIGADO -- vai para cstrike/cfg/lendas/mg_off.cfg
//
// Executado pelo plugin ao sair de um mapa de minigame, ou no sm_mg 0. So
// roda quando o modo estava mesmo ligado: em mapa comum este arquivo nao e
// tocado, e por isso nao tem como atropelar um mix.
//
// Serve para QUALQUER perfil (mg_on ou mg_surf): devolve tudo que os dois
// mexem, entao nao precisa saber qual deles rodou.
// ==========================================================================

// --- 1. O que o server.cfg NAO desfaz ------------------------------------
// Nenhum cvar de movimento aparece no server.cfg. Sem este bloco o servidor
// sairia do mapa de minigame com o bunnyhop ligado, e o mix seguinte ficaria
// estranho sem ninguem ligar uma coisa a outra.
//
// Os valores sao os padroes do CS:S. O sv_airaccelerate 10 tem confirmacao
// extra: e o que o abnermix/cpl.cfg -- a configuracao competitiva da casa --
// usa quando o mix comeca.
sv_enablebunnyhopping 0
sv_autobunnyhopping 0
sv_airaccelerate 10
sv_maxvelocity 3500
sv_enableboost 0
mp_falldamage 1

// --- 2. O resto ----------------------------------------------------------
// Em vez de repetir os valores da casa aqui e deixar as duas copias
// divergirem com o tempo, o proprio server.cfg e reexecutado. O que valer la
// passa a valer aqui, hoje e depois de qualquer edicao futura.
//
// Reexecutar e seguro: conferido linha a linha, o server.cfg nao tem map,
// changelevel, restart nem quit -- so ajuste de cvar e os dois exec de
// banidos.
exec server.cfg

mp_restartgame 1
