// ==========================================================================
// Modo minigame DESLIGADO -- vai para cstrike/cfg/lendas/mg_off.cfg
//
// Executado pelo plugin lendas_mg ao sair de um mapa de minigame, ou no
// sm_mg 0. So roda quando o modo estava mesmo ligado: em mapa comum este
// arquivo nao e tocado, e por isso nao tem como atropelar um mix.
//
// As duas partes abaixo existem por motivos diferentes.
// ==========================================================================

// --- 1. O que o server.cfg NAO desfaz ------------------------------------
// Nenhum cvar de movimento aparece no server.cfg. Se este bloco nao
// existisse, o servidor sairia do mapa de minigame com o bunnyhop ligado e
// ninguem entenderia por que o mix seguinte esta estranho.
sv_enablebunnyhopping 0
sv_autobunnyhopping 0
sv_airaccelerate 10
sv_enableboost 0

// --- 2. O resto ----------------------------------------------------------
// Em vez de repetir os valores da casa aqui e deixar as duas copias
// divergirem com o tempo, o proprio server.cfg e reexecutado. O que valer la
// passa a valer aqui, hoje e depois de qualquer edicao futura.
//
// Reexecutar e seguro: conferido linha a linha, o server.cfg nao tem map,
// changelevel, restart nem quit -- so ajuste de cvar e os dois exec de
// banidos.
exec server.cfg

mp_restartgame 1
