// ==========================================================================
// Modo minigame LIGADO -- vai para cstrike/cfg/lendas/mg_on.cfg
//
// Perfil padrao: minigame e bunnyhop. Mapas surf usam outro perfil, o
// mg_surf.cfg, porque surf e bhop querem coisas opostas de airaccelerate.
//
// Executado pelo plugin lendas_mg. O par deste arquivo e o mg_off.cfg: tudo
// que muda aqui precisa voltar la, porque o server.cfg NAO fala de movimento
// e nao desfaz nada disso na proxima troca de mapa.
//
// TODOS os cvars abaixo foram conferidos dentro do server_srv.so deste
// servidor. Cvar que nao existe o CS:S ignora calado, e a cfg fica com cara
// de certa sem fazer nada -- foi assim que o sv_full_alltalk saiu daqui, e
// os de stamina do CS:GO (sv_staminajumpcost e companhia) nem entraram.
//
// Sem acento de proposito: os cfg deste servidor estao em Latin-1.
// ==========================================================================

// --- Bunnyhop ------------------------------------------------------------
// Estes dois sao o coracao da coisa: o primeiro tira o teto de velocidade, o
// segundo pula sozinho enquanto o espaco fica segurado -- e o que torna o
// bhop jogavel para quem nao treinou scroll.
sv_enablebunnyhopping 1
sv_autobunnyhopping 1

// Aceleracao no ar: e ela que deixa ganhar velocidade virando o mouse, e o
// que separa "pula rapidinho" de bhop de verdade. O padrao do jogo e 10 e o
// mix usa 10. 1000 e o valor de servidor de bhop classico.
sv_airaccelerate 1000

// Teto absoluto de velocidade, padrao 3500. Com bhop solto da para encostar
// nele, e ai o jogador bate num muro invisivel no melhor da corrida.
sv_maxvelocity 10000

// Subir no colega. Metade dos mapas de minigame conta com isso.
sv_enableboost 1

// Sem dano de queda: mapa de minigame vive de altura, e morrer de queda no
// meio da brincadeira nao tem graca.
// O mp_falldamage NAO entra aqui: ele existe no binario do CS:S (herdado do
// Half-Life 2, junto de mp_teamplay e mp_forcerespawn) mas o jogo IGNORA o
// valor -- ele calcula o dano de queda no proprio codigo. A linha ficou meses
// na configuracao sem fazer nada. Quem tira o dano de queda e o plugin
// lendas_semqueda.

// De proposito NAO se mexe em sv_gravity, sv_friction, sv_accelerate nem
// sv_stopspeed. Varios mapas de minigame ajustam a gravidade por conta
// propria, e sobrescrever isso quebraria o mapa. Os outros nao fazem falta
// para bhop e tem padrao que eu nao teria como devolver com certeza.

// --- Rodada --------------------------------------------------------------
mp_friendlyfire 0
mp_startmoney 16000
mp_freezetime 0
mp_roundtime 9
mp_buytime 0.25
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_forcecamera 0
mp_allowspectators 1
mp_flashlight 1

// --- Voz -----------------------------------------------------------------
sv_alltalk 1
sm_deadtalk 1

// Reinicia para o dinheiro e o tempo de rodada valerem ja, sem esperar a
// rodada corrente acabar.
mp_restartgame 1
