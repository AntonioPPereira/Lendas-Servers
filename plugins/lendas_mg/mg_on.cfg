// ==========================================================================
// Modo minigame LIGADO -- vai para cstrike/cfg/lendas/mg_on.cfg
//
// Executado pelo plugin lendas_mg quando o mapa e de minigame, ou quando um
// admin digita sm_mg 1. O par deste arquivo e o mg_off.cfg: tudo que muda
// aqui precisa voltar la, porque o server.cfg nao fala de movimento e nao
// desfaz nada disso sozinho na proxima troca de mapa.
//
// Sem acento de proposito: os cfg deste servidor estao em Latin-1 e acento
// em UTF-8 vira lixo no console.
// ==========================================================================

// --- Movimento -----------------------------------------------------------
// O bunnyhop e a razao de existir deste arquivo. O enablebunnyhopping tira o
// teto de velocidade; o autobunnyhopping pula sozinho enquanto o espaco fica
// segurado, que e o que torna a coisa jogavel para quem nao treinou scroll.
sv_enablebunnyhopping 1
sv_autobunnyhopping 1

// Aceleracao no ar: e ela que permite ganhar velocidade virando o mouse.
// O padrao do jogo e 10, e o mix usa 10. 100 e o valor classico de servidor
// de bhop -- rapido, mas ainda controlavel. Suba com cuidado.
sv_airaccelerate 100

// Subir no colega. Metade dos mapas de minigame conta com isso.
sv_enableboost 1

// --- Rodada --------------------------------------------------------------
mp_friendlyfire 0
mp_startmoney 16000
mp_freezetime 0
mp_roundtime 9
mp_buytime 0.25
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_forcecamera 0
mp_allowspectators 1
mp_flashlight 1

// --- Voz -----------------------------------------------------------------
sv_alltalk 1
sv_full_alltalk 1
sm_deadtalk 1

// Reinicia para o dinheiro e o tempo de rodada valerem ja, sem esperar a
// rodada corrente acabar.
mp_restartgame 1
