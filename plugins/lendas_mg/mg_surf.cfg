// ==========================================================================
// Modo minigame, perfil SURF -- vai para cstrike/cfg/lendas/mg_surf.cfg
//
// Escolhido pelo plugin quando o mapa casa com uma linha marcada "surf" no
// lendas_mg_maps.cfg.
//
// Por que existe um perfil separado: surf e bhop pedem coisas opostas do
// sv_airaccelerate. No bhop, quanto maior melhor -- e por isso o perfil
// padrao usa 1000. No surf, aceleracao alta demais tira a dificuldade: a
// rampa vira corredor e o mapa perde a graca. 150 e o valor que os
// servidores de surf usam ha anos.
//
// O resto do arquivo e igual ao mg_on.cfg de proposito. Os dois sao desfeitos
// pelo MESMO mg_off.cfg, que por isso nao precisa saber qual perfil rodou.
// ==========================================================================

// --- Movimento de surf ---------------------------------------------------
sv_enablebunnyhopping 1
sv_autobunnyhopping 1
sv_airaccelerate 150
sv_maxvelocity 10000
sv_enableboost 1
mp_falldamage 0

// --- Rodada --------------------------------------------------------------
mp_friendlyfire 0
mp_startmoney 16000
mp_freezetime 0
mp_roundtime 9
mp_buytime 0.25
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_forcecamera 0
mp_allowspectators 1
mp_flashlight 1

sv_alltalk 1
sm_deadtalk 1

mp_restartgame 1
