// ==========================================================================
// Lista do modo minigame -- VARIANTE DO SERVIDOR 02 (104.234.65.243:27490)
// Vai para addons/sourcemod/configs/lendas_mg_maps.cfg NAQUELE servidor.
//
// O Servidor 02 deixou de ser de mix e virou minigame o tempo todo. Por isso
// aqui existe um curinga "*" no fim, que casa com QUALQUER mapa: o modo fica
// ligado sempre, e essa passa a ser a configuracao padrao da casa.
//
// Por que assim, e nao copiando os cvars para o server.cfg do 02: um lugar so
// manda no assunto. Duas copias dos mesmos valores divergem com o tempo, e a
// primeira pessoa a editar uma delas nao vai desconfiar da outra. Voltar
// atras aqui e apagar uma linha.
//
// O mg_off.cfg continua existindo e funcionando: se alguem digitar !mg 0, ou
// se este arquivo voltar a ser o do Servidor 01, o modo se desfaz sozinho.
//
// O resto do formato e igual ao do arquivo principal -- ver
// lendas_mg_maps.cfg, inclusive a regra de que a PRIMEIRA linha que casa
// ganha, e que por isso excecao por mapa vai em cima.
// ==========================================================================


// --- 1. EXCECOES POR MAPA -- sempre antes dos curingas -------------------
//
//     mg_algum_mapa_misto     combo
//     mg_outro_com_rampa      surf
//
// O proprio mapa manda `sv_airaccelerate 150` numa entidade
// point_servercommand: e um percurso de precisao, nao de velocidade.
// O perfil surf usa exatamente 150, entao a cfg passa a CONCORDAR com
// o mapa -- e assim nao importa qual dos dois roda por ultimo.
mg_office_coursee_2011  surf

// (o nome tem dois "e" mesmo: o arquivo e mg_office_coursee_2011.bsp)


// --- 2. FAMILIAS ---------------------------------------------------------

surf_*          surf    // rampa quer aceleracao menor; ver mg_surf.cfg

mg_*                    // minigame em geral
he_*
breakglass*
deathrun_*
bhop_*
kz_*
xc_*           // climb tambem; e o mesmo tipo de mapa que o kz_


// --- 3. TODO O RESTO -----------------------------------------------------
//
// Este curinga e o que torna o servidor minigame por padrao. Ele fica por
// ULTIMO de proposito: tudo que estiver acima decide primeiro, entao um mapa
// surf ainda pega o perfil de surf em vez de cair aqui.

*                       // qualquer outro mapa: perfil padrao (bhop)
