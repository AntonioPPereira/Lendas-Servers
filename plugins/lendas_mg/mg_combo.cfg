// ==========================================================================
// Modo minigame, perfil COMBO -- vai para cstrike/cfg/lendas/mg_combo.cfg
//
// Para mapa que tem rampa de surf E trecho de bhop no mesmo mapa.
//
// O sv_airaccelerate nao e uma chave "surf ou bhop": e o quanto se ganha de
// velocidade estrafando no ar. Com sv_enablebunnyhopping ligado o bhop
// funciona em 150 tambem, so acelera mais devagar; e o surf funciona em 1000,
// so fica facil demais. Por isso mapa misto nao fica sem saida -- ele quer um
// valor no meio.
//
// 300: o bhop ainda engrena rapido o bastante para ser divertido, e a rampa
// ainda exige alguma coisa de quem esta nela.
// ==========================================================================

// --- Movimento misto -----------------------------------------------------
sv_enablebunnyhopping 1
sv_autobunnyhopping 1
sv_airaccelerate 300
sv_maxvelocity 10000
sv_enableboost 1
// O mp_falldamage NAO entra aqui: ele existe no binario do CS:S (herdado do
// Half-Life 2, junto de mp_teamplay e mp_forcerespawn) mas o jogo IGNORA o
// valor -- ele calcula o dano de queda no proprio codigo. A linha ficou meses
// na configuracao sem fazer nada. Quem tira o dano de queda e o plugin
// lendas_semqueda.

// --- Rodada --------------------------------------------------------------
mp_friendlyfire 0
mp_startmoney 16000
mp_freezetime 0
mp_roundtime 9
mp_buytime 0.25
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_forcecamera 0
mp_allowspectators 1
mp_flashlight 1

sv_alltalk 1
sm_deadtalk 1

mp_restartgame 1
