// Mapas que ligam o modo minigame sozinhos.
// Vai para addons/sourcemod/configs/lendas_mg_maps.cfg
//
// Uma entrada por linha. Terminada em * vale como "comeca com"; sem o *, o
// nome tem de bater inteiro. Maiuscula e minuscula dao no mesmo.
//
// O plugin le este arquivo a cada troca de mapa: da para acrescentar um mapa
// aqui e ele ja valer no mapa seguinte, sem recarregar plugin nem reiniciar
// o servidor.

mg_*            // minigame em geral
he_*            // mapas so de granada
breakglass*     // os de quebrar vidro
deathrun_*
surf_*
bhop_*
kz_*

// Fora da lista de proposito: aim_*, ar_pond e tr_MWII. Sao mapas de treino
// e mira, onde o pessoal quer o movimento normal do jogo -- ligar bunnyhop
// neles atrapalharia o treino. Se quiser algum deles no modo, e so somar
// aqui.
