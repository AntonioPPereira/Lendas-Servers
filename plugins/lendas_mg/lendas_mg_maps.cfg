// Mapas que ligam o modo minigame sozinhos.
// Vai para addons/sourcemod/configs/lendas_mg_maps.cfg
//
// Uma entrada por linha:
//
//     <padrao>  [perfil]
//
// O padrao terminado em * vale como "comeca com"; sem o *, o nome tem de
// bater inteiro. Maiuscula e minuscula dao no mesmo.
//
// O perfil e opcional e escolhe QUAL configuracao roda: sem perfil usa o
// cfg/lendas/mg_on.cfg (minigame e bhop); com "surf" usa o mg_surf.cfg. Isso
// existe porque bhop e surf querem coisas opostas do sv_airaccelerate -- num
// e quanto maior melhor, no outro valor alto demais tira a dificuldade.
//
// Para criar um perfil novo: escreva cfg/lendas/mg_<nome>.cfg e ponha <nome>
// na segunda coluna. O mg_off.cfg desfaz qualquer um deles.
//
// O plugin le este arquivo a cada troca de mapa: da para acrescentar um mapa
// aqui e ele ja valer no mapa seguinte, sem recarregar plugin nem reiniciar
// o servidor.

mg_*                    // minigame em geral
he_*                    // mapas so de granada
breakglass*             // os de quebrar vidro
deathrun_*
bhop_*
kz_*

surf_*          surf    // rampa quer aceleracao menor; ver mg_surf.cfg

// Fora da lista de proposito: aim_*, ar_pond, tr_MWII e army_bridge. Os
// primeiros sao de treino de mira, onde o pessoal quer o movimento normal do
// jogo. O army_bridge, apesar de vir marcado como minigame no GameBanana, e
// um mapa de bomba com 1000 de vida -- bunnyhop la seria estranho. Se quiser
// qualquer um deles no modo, e so somar aqui (ou digitar !mg dentro dele).
