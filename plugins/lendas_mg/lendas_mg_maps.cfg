// ==========================================================================
// Mapas que ligam o modo minigame sozinhos.
// Vai para addons/sourcemod/configs/lendas_mg_maps.cfg
//
// FORMATO
//     <padrao>  [perfil]
//
//   O padrao terminado em * vale como "comeca com"; sem o *, o nome do mapa
//   tem de bater inteiro. Maiuscula e minuscula dao no mesmo.
//
//   O perfil e opcional e escolhe QUAL configuracao roda:
//       (vazio)   cfg/lendas/mg_on.cfg      airaccelerate 1000  bhop solto
//       surf      cfg/lendas/mg_surf.cfg    airaccelerate  150  rampa
//       combo     cfg/lendas/mg_combo.cfg   airaccelerate  300  rampa + bhop
//
//   Perfil novo: escreva cfg/lendas/mg_<nome>.cfg e ponha <nome> aqui. O
//   mg_off.cfg desfaz qualquer um deles, entao nao precisa de par.
//
// A REGRA QUE PEGA TODO MUNDO
//   A PRIMEIRA linha que casar ganha, e o resto nem e olhado. Por isso mapa
//   com nome inteiro vai LA EM CIMA: escrito depois do "mg_*", um mapa
//   chamado mg_qualquercoisa perderia para o curinga e nunca veria o perfil
//   que voce escolheu para ele.
//
// O plugin rele este arquivo a cada troca de mapa: da para acrescentar um
// mapa aqui e ele ja valer no mapa seguinte, sem recarregar plugin nem
// reiniciar o servidor.
// ==========================================================================


// --- 1. EXCECOES POR MAPA -- sempre antes dos curingas -------------------
//
// Mapa que mistura rampa e bhop, ou que so fica bom com outro perfil, entra
// aqui com o nome inteiro. Exemplo de como ficaria:
//
//     mg_algum_mapa_misto     combo
//     mg_outro_com_rampa      surf
//
// O proprio mapa manda `sv_airaccelerate 150` numa entidade
// point_servercommand: e um percurso de precisao, nao de velocidade.
// O perfil surf usa exatamente 150, entao a cfg passa a CONCORDAR com
// o mapa -- e assim nao importa qual dos dois roda por ultimo.
mg_office_coursee_2011  surf

// (o nome tem dois "e" mesmo: o arquivo e mg_office_coursee_2011.bsp)


// --- 2. FAMILIAS ---------------------------------------------------------

mg_*                    // minigame em geral
he_*                    // mapas so de granada
breakglass*             // os de quebrar vidro
deathrun_*
bhop_*
kz_*

surf_*          surf    // rampa quer aceleracao menor; ver mg_surf.cfg


// --- 3. FORA DA LISTA DE PROPOSITO ---------------------------------------
//
// aim_*, ar_pond e tr_MWII sao de treino de mira, onde o pessoal quer o
// movimento normal do jogo. O army_bridge, apesar de vir marcado como
// minigame no GameBanana, e um mapa de bomba com 1000 de vida -- bunnyhop la
// seria estranho.
//
// Para trazer qualquer um deles, e so escrever o nome na secao 1. Ou, para
// uma vez so, digitar !mg dentro do mapa.
