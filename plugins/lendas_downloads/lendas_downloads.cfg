// ==========================================================================
// Conteudo customizado que o cliente precisa baixar.
// Vai para addons/sourcemod/configs/lendas_downloads.cfg
//
// Um caminho por linha, a partir da pasta cstrike/. Comentario com //.
//
// POR QUE ESTA LISTA EXISTE
// O lendas_vip veste as skins mas nunca chama AddFileToDownloadsTable, entao
// o cliente nao era avisado de que havia o que baixar e desenhava ERROR no
// lugar do boneco. Os arquivos sempre estiveram no servidor e no FastDL: o
// que faltava era o convite.
//
// POR QUE ELA E MINIMA
// A pasta materials/models/gfl2_charolic tem 73 arquivos e 257 MB, mas o
// modelo tatico usa 9 materiais. Mandar a pasta inteira faria cada jogador
// baixar 257 MB de textura de roupa que o modelo nem tem. Esta lista saiu de
// ler o que cada .mdl pede e o que cada .vmt referencia -- da uns 48 MB.
//
// MAIUSCULA E MINUSCULA IMPORTAM
// O servidor e Linux. Os nomes aqui sao os do DISCO, nao os que o .vmt pede:
// o wheelchair01.vtf esta em minuscula no disco e o .vmt pede WheelChair01.
// No cliente Windows tanto faz; no caminho ate ele, nao.
// ==========================================================================


