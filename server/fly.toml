# fly.toml app configuration file generated for lendas-backend on 2026-09-14T17:26:14-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lendas-backend'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGIN = 'https://www.lendascss.com.br,https://lendascss.com.br,https://lendas-servers.vercel.app'
  # Host de SFTP do ClanServers (migrado). O usuário/senha vão como secrets
  # (fly secrets set SFTP_USERNAME / SFTP_PASSWORD), nunca aqui.
  SFTP_HOST = 'sftp.clanservers.com.br'
  SFTP_PORT = '8822'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
